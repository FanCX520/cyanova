name: Validate Cyanova build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyanova-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build all company pages
        run: npm run build
      - name: Verify deployable pages
        run: |
          test -f dist/index.html
          test -f dist/solutions.html
          test -f dist/about.html
          test -f dist/contact.html

# Deployment is handled by the native GitHub connection of the
# Cloudflare Pages project `cyanova-git`; no Cloudflare token is stored here.
